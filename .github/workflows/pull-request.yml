name: Pull Request Validation

# Pull requests to main and every push to main (the merge result). The jobs call
# the Makefile targets, so a developer runs the same commands locally.
# scripts/check-workflows.sh (make check-workflows) enforces the rules for the
# workflows themselves: pinned actions, permissions, timeouts. The PR title
# check is in pr-title.yml: it runs on title edits, which must not touch these
# jobs (no cancelled run, no skipped job that branch protection reads as passed).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow hygiene
        run: make check-workflows

      - name: Dockerfile hardening
        run: make check-dockerfiles

      - name: Trivy ignore list
        run: make check-trivyignore

      - name: Environment variable docs
        run: make check-env-docs

      - name: Claude agents and settings
        run: make check-agents

      - name: Make targets
        run: make check-make-targets

      - name: Production credentials guard
        run: make test-prod-credentials

      - name: Domain terms
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          make check-domain-terms

      - name: Shell scripts
        run: make shellcheck

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: make lint-backend

      # scripts/gosec.sh builds the pinned gosec with the Go above and runs it
      # inside backend/ (see the script for why not the Docker action).
      - name: Gosec
        run: make gosec

      - name: Unit tests (race detector)
        run: make test-backend-unit

      # Starts MySQL with Docker Compose (service db), then runs every package
      # with the integration tag, one package at a time (-p 1: the packages
      # share one database).
      - name: Integration tests (MySQL)
        run: make test-backend-all

      - name: MySQL logs after a failure
        if: failure()
        run: docker compose logs db

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # frontend/.nvmrc is the one place for the Node major (the Dockerfile uses
      # the same major).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        run: make lint-frontend

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        run: make test-frontend

  docs:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Markdown lint
        run: make lint-docs
