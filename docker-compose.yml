services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-app}
      - MYSQL_USER=${MYSQL_USER:-appuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-apppass}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpass}
      - TZ=UTC
    # Loopback only: the database has default credentials unless you set your
    # own, and the backend reaches it over backend-net. A backend or a test
    # run on this host connects to 127.0.0.1:${MYSQL_PORT}. To reach it from
    # another machine, use an SSH tunnel or an override file of your own.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_logs:/var/log/mysql
      - ./backend/config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE to allow MySQL to adjust its process priority

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${GO_ENV:-production}
    # Host port of the API, for direct calls (curl, Swagger). The browser
    # calls the web UI origin, which proxies /api. The container always
    # listens on 8081.
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    # The ordered shutdown runs up to five steps of SERVER_SHUTDOWN_TIMEOUT
    # each (HTTP drain, audit log writes with AUTH_ENABLED=true, leader
    # workers, in-flight work, telemetry): 5 x 30s with the default, plus 2s
    # for the metrics and pprof servers and 2s for the replica heartbeat
    # (156s), plus a margin. Raise it with SERVER_SHUTDOWN_TIMEOUT.
    stop_grace_period: 170s
    environment:
      - APP_NAME=${APP_NAME:-application}
      # Product name in GET /api/v1/ui-config (the login page shows it). Empty
      # means the backend default.
      - APP_TITLE=${APP_TITLE:-}
      - APP_ENV=${GO_ENV:-production}
      # APP_DEBUG drives the Gin mode (true: debug, false: release).
      # GIN_MODE, when set, wins; empty leaves the choice to APP_DEBUG.
      - APP_DEBUG=${APP_DEBUG:-false}
      - GIN_MODE=${GIN_MODE:-}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-app}
      - DB_USER=${MYSQL_USER:-appuser}
      - DB_PASSWORD=${MYSQL_PASSWORD:-apppass}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-25}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-25}
      - DB_CONN_MAX_LIFETIME=${DB_CONN_MAX_LIFETIME:-5m}
      - SERVER_HOST=0.0.0.0
      - PORT=8081
      - SERVER_READ_TIMEOUT=${SERVER_READ_TIMEOUT:-15s}
      - SERVER_WRITE_TIMEOUT=${SERVER_WRITE_TIMEOUT:-15s}
      - SERVER_SHUTDOWN_TIMEOUT=${SERVER_SHUTDOWN_TIMEOUT:-30s}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Client IP behind the bundled proxy: only the frontend container
      # (nginx in production, the Vite dev server in development), at its
      # fixed address on frontend-net, may set X-Forwarded-For / X-Real-IP.
      # Do not trust the whole subnet: on some Docker setups its gateway is
      # the source of traffic from the host, and a trusted gateway lets a
      # client pick its IP. See README "Behind a proxy".
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-${FRONTEND_PROXY_IP:-172.30.80.10}}
      # Requests per minute per client IP (API) and login attempts per
      # minute per client IP.
      - RATE_LIMIT=${RATE_LIMIT:-100}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-10}
      # Swagger UI at /swagger/index.html. Off by default; make dev and
      # make dev-backend set ENABLE_SWAGGER=true.
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-false}
      - LOG_FILE=${LOG_FILE:-}
      - API_VERSION=${API_VERSION:-v1}
      - API_PREFIX=${API_PREFIX:-/api}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Origin,Content-Type,Accept,Authorization}
      - CORS_MAX_AGE=${CORS_MAX_AGE:-300}
      # Authentication: off by default. There is no default secret: with
      # AUTH_ENABLED=true the backend refuses to start unless JWT_SECRET has
      # at least 16 characters, and it creates the first admin only when
      # ADMIN_PASSWORD is set (8 to 72 bytes). An empty value below means the
      # backend default (see backend/.env.example).
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SELF_REGISTRATION=${SELF_REGISTRATION:-false}
      # Secure refresh cookie (__Host-refresh_token), the default. Browsers
      # accept it on http://localhost; false only for plain HTTP on another
      # host name.
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - SESSION_STORE=${SESSION_STORE:-mysql}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-}
      - ACCESS_TOKEN_EXPIRATION=${ACCESS_TOKEN_EXPIRATION:-}
      - SESSION_IDLE_TIMEOUT=${SESSION_IDLE_TIMEOUT:-}
      - SESSION_MAX_LIFETIME=${SESSION_MAX_LIFETIME:-}
      - REFRESH_TOKEN_EXPIRATION=${REFRESH_TOKEN_EXPIRATION:-}
      - REFRESH_REUSE_GRACE=${REFRESH_REUSE_GRACE:-}
      # Several replicas on one database, and the per-user /ws socket cap. An
      # empty value keeps the backend default (false, false and 16): these
      # three are read strictly, a value that does not parse stops the start,
      # and empty is not a value. PPROF_* is not passed: profiling needs an
      # override of your own (see "Profiling" in docs/claude/operations.md).
      - LEADER_ELECTION_ENABLED=${LEADER_ELECTION_ENABLED:-}
      - REPLICA_HEARTBEAT_ENABLED=${REPLICA_HEARTBEAT_ENABLED:-}
      - WS_MAX_CONNECTIONS_PER_USER=${WS_MAX_CONNECTIONS_PER_USER:-}
      # Idempotency keys for POST (optional module, off by default). Empty keeps
      # the backend default (false, 24h and 60s).
      - IDEMPOTENCY_ENABLED=${IDEMPOTENCY_ENABLED:-}
      - IDEMPOTENCY_TTL=${IDEMPOTENCY_TTL:-}
      - IDEMPOTENCY_LOCK_TIMEOUT=${IDEMPOTENCY_LOCK_TIMEOUT:-}
      # Transactional outbox for the Items WebSocket events (optional module, off
      # by default). Empty keeps the backend default (false, 500ms and 1h).
      - OUTBOX_ENABLED=${OUTBOX_ENABLED:-}
      - OUTBOX_POLL_INTERVAL=${OUTBOX_POLL_INTERVAL:-}
      - OUTBOX_RETENTION=${OUTBOX_RETENTION:-}
      # Response compression (gzip, on by default). Empty keeps the backend
      # default (true and 1024 bytes).
      - COMPRESSION_ENABLED=${COMPRESSION_ENABLED:-}
      - COMPRESSION_MIN_SIZE=${COMPRESSION_MIN_SIZE:-}
      # Mail and password reset (optional modules, off by default). Empty keeps
      # the backend default (MAIL_ENABLED=false, port 587, starttls, 10s;
      # PASSWORD_RESET_ENABLED=false, 1h, 60s). These are read strictly while the
      # module is on. make prod* never starts a mail catcher: set your own SMTP
      # server. docker-compose.mail.yml (make dev-mail) adds a local catcher.
      - MAIL_ENABLED=${MAIL_ENABLED:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_TLS=${SMTP_TLS:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-}
      - PASSWORD_RESET_ENABLED=${PASSWORD_RESET_ENABLED:-}
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-}
      - PASSWORD_RESET_TOKEN_TTL=${PASSWORD_RESET_TOKEN_TTL:-}
      - PASSWORD_RESET_MIN_INTERVAL=${PASSWORD_RESET_MIN_INTERVAL:-}
      # OpenID Connect single sign-on (needs AUTH_ENABLED=true): off by default.
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-}
      - OIDC_ROLE_CLAIM=${OIDC_ROLE_CLAIM:-}
      - OIDC_ADMIN_ROLES=${OIDC_ADMIN_ROLES:-}
      - OIDC_DEVOPS_ROLES=${OIDC_DEVOPS_ROLES:-}
      - OIDC_LOCAL_AUTH=${OIDC_LOCAL_AUTH:-false}
      - OIDC_STATE_TTL=${OIDC_STATE_TTL:-}
      - OIDC_FRONTEND_PATH=${OIDC_FRONTEND_PATH:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The development image compiles the backend at start (go run): a cold
      # build with an empty module cache takes a minute or more. Failed
      # checks in this window do not count, a passing one ends it early.
      start_period: 120s
    volumes:
      - ./backend:/app
      - backend_go_mod:/go/pkg/mod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-production}
      args:
        - NODE_ENV=${NODE_ENV:-production}
    # Host port of the web UI. The container listens on 8080 (unprivileged
    # nginx, the default production image) or 3000 (Vite dev server): make
    # dev sets FRONTEND_CONTAINER_PORT=3000 together with NODE_ENV=development.
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_CONTAINER_PORT:-8080}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_API_URL=http://backend:8081
    depends_on:
      backend:
        condition: service_healthy
    networks:
      frontend-net:
        # Fixed address: the backend trusts exactly this proxy
        # (TRUSTED_PROXIES).
        ipv4_address: ${FRONTEND_PROXY_IP:-172.30.80.10}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  mysql_data:
    driver: local  # Explicitly set local driver
  mysql_logs:
    driver: local  # For MySQL logs
  backend_go_mod:
  frontend_node_modules:

# Network and volume names are scoped by the Compose project. Two checkouts
# still collide on the host ports (3000, 8081, 3306) and on the fixed subnet
# below: change BACKEND_PORT, FRONTEND_PORT, MYSQL_PORT, FRONTEND_NET_SUBNET
# and FRONTEND_PROXY_IP for the second one.
networks:
  backend-net:
  frontend-net:
    ipam:
      config:
        # Explicit subnet so that the frontend proxy has a fixed address.
        # Change FRONTEND_NET_SUBNET and FRONTEND_PROXY_IP together when the
        # range is in use on the host.
        - subnet: ${FRONTEND_NET_SUBNET:-172.30.80.0/24}
