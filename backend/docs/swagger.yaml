  /api/v1/users/{id}/role:
    put:
      consumes:
      - application/json
      description: 'Sets the role of a user. Admin only, with a login session; the
        caller must still be an enabled admin in the database (403). The last enabled
        admin cannot be demoted (409); an admin may demote themselves when another
        enabled admin exists. An unchanged role changes nothing (changed=false, no
        audit entry) but ends the sessions of the user again, so repeating a request
        whose answer was 500 finishes the revocation. A change ends every session
        of the user: access tokens issued before it are rejected (user block), refresh
        tokens are revoked and the WebSockets are closed, so the next request needs
        a new login that carries the new role; the user''s API keys stay and use the
        new role at once. The role of an SSO user is set by the identity provider
        at each login (OIDC_ADMIN_ROLES, OIDC_DEVOPS_ROLES) and can override this
        change: the response has idp_managed=true. The user block is retried a few
        times; when the change committed but a revocation step still failed, the answer
        is 500 and the change stands: repeat the same request to finish the revocation.
        Unknown request fields are refused.'
