  /api/v1/users/{id}/disabled:
    put:
      consumes:
      - application/json
      description: 'Disables (disabled=true) or enables (disabled=false) a user. Admin
        only, with a login session; the caller must still be an enabled admin in the
        database (403). The last enabled admin cannot be disabled (409); an admin
        may disable themselves when another enabled admin exists. Disabling ends every
        session of the user: access tokens issued before it are rejected (user block),
        refresh tokens are revoked and the WebSockets are closed. The user''s API
        keys are kept but stop authenticating while the owner is disabled. Enabling
        writes no new block: tokens issued before the disable stay rejected, and a
        login after the enable works. A request that does not change the state is
        a no-op (changed=false, no audit entry; a repeated disable still ends the
        sessions). Unknown request fields are refused. With the password reset module
        on, disabling also deletes the user''s unused reset tokens.'
