basePath: /
definitions:
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handlers.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.RefreshResponse:
    properties:
      token:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handlers.UIConfigResponse:
    properties:
      auth_enabled:
        description: AuthEnabled tells the UI whether to show the login flow (AUTH_ENABLED).
        example: false
        type: boolean
      title:
        description: Title is the product name (APP_TITLE).
        example: Application Template
        type: string
    type: object
  health.CheckStatus:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  health.HealthStatus:
    properties:
      checks:
        additionalProperties:
          $ref: '#/definitions/health.CheckStatus'
        type: object
      status:
        type: string
      uptime:
        type: string
    type: object
  models.Item:
    properties:
      created_at:
        example: "2025-06-02T10:00:00Z"
        type: string
      deleted_at:
        format: date-time
        type: string
      id:
        example: 1
        type: integer
      name:
        type: string
      price:
        type: number
      updated_at:
        example: "2025-06-02T10:00:00Z"
        type: string
      version:
        description: For optimistic locking (1 = initial; 0 = not provided)
        type: integer
    type: object
  models.User:
    properties:
      auth_provider:
        type: string
      created_at:
        type: string
      disabled:
        type: boolean
      display_name:
        type: string
      email:
        type: string
      external_id:
        description: |-
          ExternalID is the subject at the identity provider; nil for a local
          user. (auth_provider, external_id) is unique; MySQL allows many NULLs.
        type: string
      id:
        type: string
      role:
        type: string
      service_account:
        description: |-
          ServiceAccount marks a local account that may still sign in with a
          password when OIDC is the only interactive login (break-glass).
        type: boolean
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: This is the API documentation for the backend service
  title: Backend API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 'Authenticate with username and password; returns a JWT access
        token and the user. With refresh sessions on, the login starts a session:
        the access token lives ACCESS_TOKEN_EXPIRATION and carries the session ID
        (sid), and the response sets the httpOnly refresh_token cookie (Path /api/v1/auth,
        SameSite=Strict, Secure unless SECURE_COOKIES=false) for POST /api/v1/auth/refresh;
        without them the token lives JWT_EXPIRATION. With refresh sessions on, the
        request needs the X-Requested-With header (any value) and must not be cross-site
        (403), and its Content-Type must be application/json (415); both are checked
        first (login CSRF protection). Every credential failure (unknown user, wrong
        password, disabled account, SSO-only account) answers the same 401 "Invalid
        username or password". After 5 failed attempts for one username within 15
        minutes, every login for that username answers 429 with Retry-After for 15
        minutes.'
      parameters:
      - description: Required with refresh sessions on (any value, for example XMLHttpRequest)
        in: header
        name: X-Requested-With
        type: string
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Cross-site request refused
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "415":
          description: Content-Type must be application/json
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: 'Ends the sessions that the request proves: the session of the
        refresh token cookie and the session (sid) of a valid bearer token. It revokes
        their refresh tokens, blocks the sessions so that all their access tokens
        get 401, blocks the presented access token until its expiry, closes the WebSockets
        opened with it and deletes the cookie. Other sessions of the user keep working.
        An expired or invalid bearer token is ignored. A request without a cookie
        and without a valid bearer token ends nothing and answers 200; a repeated
        logout answers 200. The request needs the X-Requested-With header (any value)
        and must not be cross-site; otherwise 403. When a lookup, revoke or block
        fails, the other steps still run and the cookie is deleted, but the answer
        is 500.'
      parameters:
      - description: Any value (CSRF protection), for example XMLHttpRequest
        in: header
        name: X-Requested-With
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Cross-site request refused
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - auth
  /api/v1/auth/logout-all:
    post:
      description: 'Ends every session of the current user: revokes all their refresh
        tokens, blocks every session that can still hold a live access token, writes
        a user block that rejects every access token issued up to now, blocks the
        presented access token, closes all WebSockets of the user and deletes the
        cookie. A login after the answer works. It is idempotent. When a step fails,
        the other steps still run and the answer is 500.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout from all sessions
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user. A disabled account answers 401,
        a deleted one 404.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: Issues a new access token for the session of the refresh token
        cookie and rotates the refresh token (the old one is consumed, a new cookie
        is set). The request needs the X-Requested-With header (any value) and must
        not be cross-site; otherwise 403. A session ends SESSION_MAX_LIFETIME after
        login and SESSION_IDLE_TIMEOUT after its last login or refresh; rotation never
        extends it, and the access token never outlives it. A token rotated less than
        REFRESH_REUSE_GRACE ago (two tabs refreshing at once) gets one more access
        token, once, without a new cookie. Any other reuse of a consumed token revokes
        the session and blocks its access tokens. Every refusal answers the same 401
        and deletes the cookie.
      parameters:
      - description: Any value (CSRF protection), for example XMLHttpRequest
        in: header
        name: X-Requested-With
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RefreshResponse'
        "401":
          description: Invalid or expired session
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Cross-site request refused
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "501":
          description: Refresh tokens not enabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Self-registration of a local account with the role user. Only available
        when SELF_REGISTRATION is true; otherwise 404. Role, disabled, provider and
        service account fields in the body are ignored. The username is 3 to 100 characters
        (letters, digits and . _ - @, starting with a letter or digit); the password
        is at least 8 characters and at most 72 bytes.
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /api/v1/items:
    get:
      description: Get a list of all items
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Item'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all items
      tags:
      - items
    post:
      consumes:
      - application/json
      description: Create a new item with the provided information
      parameters:
      - description: Item object
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/models.Item'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request body too large
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new item
      tags:
      - items
  /api/v1/items/{id}:
    delete:
      description: Delete an item by its ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an item
      tags:
      - items
    get:
      description: Get an item by its ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get an item by ID
      tags:
      - items
    put:
      consumes:
      - application/json
      description: Update an item's information
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Item object
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/models.Item'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request body too large
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update an item
      tags:
      - items
  /api/v1/ping:
    get:
      description: Ping test endpoint
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ping test
      tags:
      - ping
  /api/v1/ui-config:
    get:
      description: 'Returns the display values of the web UI: the product title (APP_TITLE)
        and whether authentication is enabled (AUTH_ENABLED). Public: no authentication,
        so the login page can use it. Cached for 5 minutes.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UIConfigResponse'
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Web UI display config
      tags:
      - ui
  /health:
    get:
      description: Get API health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health Check
      tags:
      - health
  /health/live:
    get:
      description: Get API liveness status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.HealthStatus'
      summary: Liveness Check
      tags:
      - health
  /health/ready:
    get:
      description: Get API readiness status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.HealthStatus'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/health.HealthStatus'
      summary: Readiness Check
      tags:
      - health
  /ws:
    get:
      description: Upgrades the HTTP connection to a WebSocket for real-time events.
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Open a WebSocket connection
      tags:
      - websocket
produces:
- application/json
schemes:
- http
- https
swagger: "2.0"
