  /api/v1/users/{id}:
    delete:
      description: 'Permanently deletes a user. Admin only, with a login session;
        the caller must still be an enabled admin in the database (403). The last
        enabled admin cannot be deleted (409, answered before anything is blocked
        when the admin deletes themselves); an admin may delete themselves when another
        enabled admin exists. The user''s access ends: access tokens issued before
        are rejected (user block), refresh tokens are revoked, all their API keys
        are deleted and the WebSockets are closed. The user block is written before
        the delete (a failure answers 500 and deletes nothing, so the request can
        be repeated; a delete that the transaction guard refuses after a race, 403
        or 409, has still blocked the user''s tokens issued so far) and again after
        it (best effort); when a later step fails the answer is 500 and the user is
        gone.'
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
