  /api/v1/users/{id}:
    delete:
      description: 'Permanently deletes a user. Admin only, with a login session;
        the caller must still be an enabled admin in the database (403). The last
        enabled admin cannot be deleted (409); an admin may delete themselves when
        another enabled admin exists. The user''s access ends: access tokens issued
        before are rejected (user block), refresh tokens are revoked, all their API
        keys are deleted and the WebSockets are closed. When the delete committed
        but a revocation step failed, the answer is 500 and the user is gone.'
