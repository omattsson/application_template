      description: Changes the display name, the email and/or the password of a user.
        Admin only, with a login session. Only these fields are accepted; any other
        field (role, disabled, username, ...) is refused with 400, because role and
        disabled have endpoints of their own that enforce the last-admin rule and
        end the user's sessions. A password can be set only for a local user (400
