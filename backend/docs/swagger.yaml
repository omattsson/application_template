            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request body too large
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Disable or enable a user
      tags:
      - users
  /api/v1/users/{id}/role:
    put:
      consumes:
      - application/json
      description: 'Sets the role of a user. Admin only, with a login session; the
        caller must still be an enabled admin in the database (403). The last enabled
        admin cannot be demoted (409); an admin may demote themselves when another
        enabled admin exists. An unchanged role is a no-op (changed=false, nothing
        revoked, no audit entry). A change ends every session of the user: access
        tokens issued before it are rejected (user block), refresh tokens are revoked
        and the WebSockets are closed, so the next request needs a new login that
        carries the new role; the user''s API keys stay and use the new role at once.
        The role of an SSO user is set by the identity provider at each login (OIDC_ADMIN_ROLES,
        OIDC_DEVOPS_ROLES) and can override this change: the response has idp_managed=true.
        When the change committed but a revocation step failed, the answer is 500
        and the change stands. Unknown request fields are refused.'
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: New role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChangeRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
