basePath: /
definitions:
  handlers.APIKeyListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.APIKey'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  handlers.ChangePasswordRequest:
    properties:
      current_password:
        description: CurrentPassword is the password that the account has now.
        type: string
      new_password:
        description: |-
          NewPassword is the new password: at least 8 characters, at most 72 bytes,
          and not the current one.
        type: string
    type: object
  handlers.ChangeRoleRequest:
    properties:
      role:
        description: 'Role is the new role: "user", "devops" or "admin".'
        enum:
        - user
        - devops
        - admin
        example: devops
        type: string
    type: object
  handlers.ChangeRoleResponse:
    properties:
      changed:
        description: |-
          Changed is false when the user already had the role (a no-op: nothing
          is revoked and no audit entry is written).
        type: boolean
      id:
        type: string
      idp_managed:
        description: |-
          IDPManaged is true for an SSO user: the identity provider sets the role
          at each login (OIDC_ADMIN_ROLES and OIDC_DEVOPS_ROLES), so this change
          can be overridden at the next login.
        type: boolean
      message:
        type: string
      new_role:
        type: string
      old_role:
        type: string
    type: object
  handlers.CreateAPIKeyRequest:
    properties:
      expires_at:
        type: string
      expires_in_days:
        type: integer
      name:
        type: string
    type: object
  handlers.CreateAPIKeyResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      name:
        type: string
      prefix:
        description: |-
          Prefix is the first 16 hex characters of the key (not secret enough to
          use alone): it identifies the key in the list.
        type: string
      raw_key:
        description: RawKey is "sk_" and 64 hex characters, shown once.
        type: string
    type: object
  handlers.CreateUserRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
      role:
        description: 'Role is required: "user", "devops" or "admin".'
        enum:
        - user
        - devops
        - admin
        type: string
      username:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handlers.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.PasswordResetAcceptedResponse:
    properties:
      message:
        example: If the account exists and can receive mail, a reset link has been
          sent.
        type: string
    type: object
  handlers.PasswordResetConfirmRequest:
    properties:
      new_password:
        description: 'NewPassword is the new password: at least 8 characters, at most
          72 bytes.'
        type: string
      token:
        description: Token is the token from the link of the mail (the fragment of
          the URL).
        type: string
    type: object
  handlers.PasswordResetRequest:
    properties:
      username:
        description: Username is the name of the local account that forgot its password.
        example: alice
        type: string
    type: object
  handlers.RefreshResponse:
    properties:
      token:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handlers.SetDisabledRequest:
    properties:
      disabled:
        description: 'Disabled is required: true disables the user, false enables
          them.'
        type: boolean
    type: object
  handlers.SetDisabledResponse:
    properties:
      changed:
        description: Changed is false when the user already had that state.
        type: boolean
      disabled:
        type: boolean
      id:
        type: string
      message:
        type: string
    type: object
  handlers.UIConfigResponse:
    properties:
      auth_enabled:
        description: AuthEnabled tells the UI whether to show the login flow (AUTH_ENABLED).
        example: false
        type: boolean
      local_auth_enabled:
        description: |-
          LocalAuthEnabled tells the UI to show the username and password form:
          AUTH_ENABLED, and OIDC off or OIDC_LOCAL_AUTH=true. With OIDC on and
          OIDC_LOCAL_AUTH=false only a service account (the bootstrap admin) can
          still log in with a password, through the API.
        example: false
        type: boolean
      oidc_enabled:
        description: |-
          OIDCEnabled tells the UI to offer the single sign-on button
          (AUTH_ENABLED and OIDC_ENABLED).
        example: false
        type: boolean
      password_reset_enabled:
        description: |-
          PasswordResetEnabled tells the UI to offer "Forgot password?" and the
          pages behind it: PASSWORD_RESET_ENABLED, with auth on and the password
          form shown (local_auth_enabled). It is false whenever the two routes do
          not exist (404).
        example: false
        type: boolean
      title:
        description: Title is the product name (APP_TITLE).
        example: Application Template
        type: string
    type: object
  handlers.UpdateUserRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        description: Password is only for a local user (400 for an SSO user).
        type: string
    type: object
  handlers.UserListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.User'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  health.CheckStatus:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  health.HealthStatus:
    properties:
      checks:
        additionalProperties:
          $ref: '#/definitions/health.CheckStatus'
        type: object
      status:
        type: string
      uptime:
        type: string
    type: object
  models.APIKey:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        description: Prefix is the first APIKeyPrefixLen characters of the raw key.
        type: string
      user_id:
        type: string
    type: object
  models.AuditLog:
    properties:
      action:
        type: string
      details:
        type: string
      entity_id:
        type: string
      entity_type:
        type: string
      id:
        type: string
      timestamp:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  models.Item:
    properties:
      created_at:
        example: "2025-06-02T10:00:00Z"
        type: string
      deleted_at:
        format: date-time
        type: string
      id:
        example: 1
        type: integer
      name:
        type: string
      price:
        type: number
      updated_at:
        example: "2025-06-02T10:00:00Z"
        type: string
      version:
        description: For optimistic locking (1 = initial; 0 = not provided)
        type: integer
    type: object
  models.PaginatedAuditLogs:
    properties:
      data:
        items:
          $ref: '#/definitions/models.AuditLog'
        type: array
      limit:
        type: integer
      next_cursor:
        type: string
      offset:
        type: integer
      total:
        type: integer
    type: object
  models.User:
    properties:
      auth_provider:
        type: string
      created_at:
        type: string
      disabled:
        type: boolean
      display_name:
        type: string
      email:
        type: string
      external_id:
        description: |-
          ExternalID is the subject at the identity provider; nil for a local
          user. (auth_provider, external_id) is unique; MySQL allows many NULLs.
        type: string
      id:
        type: string
      role:
        type: string
      service_account:
        description: |-
          ServiceAccount marks a local account that may still sign in with a
          password when OIDC is the only interactive login (break-glass).
        type: boolean
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: This is the API documentation for the backend service
  title: Backend API
  version: "1.0"
paths:
  /api/v1/api-keys:
    get:
      description: Returns one page of the caller's keys, newest first. The key itself
        is never returned, only its prefix. An admin can pass all=true for the keys
        of every user, or user_id for one user; for any other role both are 403 (except
        the caller's own user_id). A request authenticated with an API key is refused
        (403).
      parameters:
      - description: Page, from 1
        in: query
        name: page
        type: integer
      - description: Page size (default 25, at most 100)
        in: query
        name: pageSize
        type: integer
      - description: 'Admin only: the keys of all users'
        in: query
        name: all
        type: boolean
      - description: 'Admin only: the keys of one user'
        in: query
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIKeyListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: 'Creates a key for the caller. The key has the role of its owner
        at the time of each request (a demoted owner''s keys are demoted). An expiry
        is required: set expires_at (YYYY-MM-DD or RFC3339) or expires_in_days, not
        both, at most 365 days ahead by default. The caller can have 25 active keys
        by default (409 above that). The raw key (sk_ and 64 hex characters) is returned
        once in raw_key, with Cache-Control no-store, and cannot be retrieved again;
        only its SHA-256 is stored. A request authenticated with an API key is refused
        (403): manage keys with a login session. Unknown request fields are refused.
        An Idempotency-Key header is ignored on this route (also with IDEMPOTENCY_ENABLED=true):
        the response holds the raw key, which the idempotency module must never store.'
      parameters:
      - description: Key name and expiry
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CreateAPIKeyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request body too large
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an API key
      tags:
      - api-keys
  /api/v1/api-keys/{id}:
    delete:
      description: 'Deletes (revokes) a key at once: it stops authenticating with
        the next request and the WebSocket connections opened with it close with code
        1008. A user can delete their own keys; an admin can delete any key. A key
        of another user, for a caller who is not an admin, is 404 like a key that
        does not exist. A request authenticated with an API key is refused (403).'
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an API key
      tags:
      - api-keys
  /api/v1/audit-logs:
    get:
      description: 'Returns one page of audit entries, newest first. Admin only, with
        a login session (an API key is refused with 403); the caller must still be
        an enabled admin in the database. Filters: user_id, action, entity_type, entity_id
        and a time range (start_date, end_date: RFC3339 with a zone, inclusive); an
        invalid value is 400. Paging: limit (default 25, at most 100) and offset (at
        most 100000), or the next_cursor of the previous page (keyset paging for deep
        pages; the cursor ignores offset and the answer has no exact total). An entry
        holds the action, the entity, the user and details (method, route, status,
        client IP, request ID and small values such as the old and new role); never
        a request or response body, header, password or key.'
      parameters:
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by entity type (lower case words with underscores)
        in: query
        name: entity_type
        type: string
      - description: Filter by entity ID
        in: query
        name: entity_id
        type: string
      - description: Filter by action (lower case words with underscores)
        in: query
        name: action
        type: string
      - description: Start (RFC3339 with a zone, inclusive)
        in: query
        name: start_date
        type: string
      - description: End (RFC3339 with a zone, inclusive)
        in: query
        name: end_date
        type: string
      - description: Page size (default 25, at most 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0, at most 100000)
        in: query
        name: offset
        type: integer
      - description: next_cursor of the previous page (overrides offset)
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedAuditLogs'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - audit-logs
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 'Authenticate with username and password; returns a JWT access
        token and the user. With refresh sessions on, the login starts a session:
        the access token lives ACCESS_TOKEN_EXPIRATION and carries the session ID
        (sid), and the response sets the httpOnly refresh_token cookie (named __Host-refresh_token
        unless SECURE_COOKIES=false; Path /, SameSite=Strict, Secure unless SECURE_COOKIES=false)
        for POST /api/v1/auth/refresh; without them the token lives JWT_EXPIRATION.
        With refresh sessions on, the request needs the X-Requested-With header (any
        value) and must not be cross-site (403), and its Content-Type must be application/json
        (415); both are checked first (login CSRF protection). Every credential failure
        (unknown user, wrong password, disabled account, SSO-only account) answers
        the same 401 "Invalid username or password". After 5 failed attempts for one
        username within 15 minutes, every login for that username answers 429 with
        Retry-After for 15 minutes. While attempts for the same username are in flight
        and use up its slots, a further attempt answers 429 with Retry-After 1. Only
        the submitted username answers 429: when the found account itself is locked
        or busy (the same account under another spelling of the name), the answer
        is the generic 401, so no answer shows whether a name is an account.'
      parameters:
      - description: Required with refresh sessions on (any value, for example XMLHttpRequest)
        in: header
        name: X-Requested-With
        type: string
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Cross-site request refused
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "415":
          description: Content-Type must be application/json
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: 'Ends the sessions that the request proves: the session of the
        refresh token cookie and the session (sid) of a valid bearer token. It revokes
        their refresh tokens, blocks the sessions so that all their access tokens
        get 401, blocks the presented access token until its expiry, closes the WebSockets
        opened with it and deletes the cookie. Other sessions of the user keep working.
        An expired or invalid bearer token is ignored. A request without a cookie
        and without a valid bearer token ends nothing and answers 200; a repeated
        logout answers 200. The request needs the X-Requested-With header (any value)
        and must not be cross-site; otherwise 403. When a lookup, revoke or block
        fails, the other steps still run and the cookie is deleted, but the answer
        is 500.'
      parameters:
      - description: Any value (CSRF protection), for example XMLHttpRequest
        in: header
        name: X-Requested-With
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Cross-site request refused
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - auth
  /api/v1/auth/logout-all:
    post:
      description: 'Ends every session of the current user: revokes all their refresh
        tokens, blocks every session that can still hold a live access token, writes
        a user block that rejects every access token issued up to now, blocks the
        presented access token, closes all WebSockets of the user and deletes the
        cookie. A login after the answer works. It is idempotent. When a step fails,
        the other steps still run and the answer is 500.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: An API key cannot end the sessions
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout from all sessions
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user. A disabled account answers 401,
        a deleted one 404.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get current user
      tags:
      - auth
  /api/v1/auth/me/password:
    put:
      consumes:
      - application/json
      description: 'Changes the password of the signed-in local user. Login session
        only (an API key is refused with 403). The body needs the current password
        and the new one (at least 8 characters, at most 72 bytes, not equal to the
        current one); unknown fields are refused. A wrong current password answers
        401 "Current password is incorrect" and counts toward the same per-account
        failure lock as the password login (5 failures within 15 minutes lock the
        account for 15 minutes; the locked account answers 429 with Retry-After, also
        for the right password). A user with no local password (an SSO account) gets
        400; with OIDC as the only interactive login (OIDC_LOCAL_AUTH=false) only
        the service account may change a password (403 otherwise); a disabled user
        gets 401. On success only the password hash is written and every other session
        of the user ends: their refresh tokens are revoked and their sessions are
        blocked, so their access tokens get 401; the open WebSockets of those sessions
        are closed by the next revalidation (within about a minute). The current session
        keeps working: its cookie, its access token and its socket are not touched.
        API keys are kept: delete them separately when the old password may have been
        exposed. The entry of the audit log has the action change_password and never
        holds a password. When the password was stored but a revocation step failed,
        the answer is 500, the new password stands and the entry has revocation_failed;
        end the remaining sessions with logout-all or change the password again. The
        login rate limit (LOGIN_RATE_LIMIT per client IP) applies.'
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: An API key cannot change a password, or password sign-in is
            disabled for the account
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change the own password
      tags:
      - auth
  /api/v1/auth/oidc/callback:
    get:
      description: The identity provider sends the browser here with a code and the
        state. The state works once and only from the browser that started the login
        (the oidc_binding cookie); the code is exchanged with the PKCE verifier; the
        ID token is validated (signature, issuer, audience, expiry, nonce). The account
        is found by issuer and sub, or created with auth_provider oidc and the role
        user (admin when a role of the OIDC_ADMIN_ROLES claim matches exactly); an
        existing OIDC account gets its role from the claim at every login. An existing
        local account is never linked or taken over. On success the answer sets the
        httpOnly refresh_token cookie (named __Host-refresh_token unless SECURE_COOKIES=false)
        and redirects (302) to the fixed web UI path OIDC_FRONTEND_PATH, without any
        token in the URL; the web UI then calls POST /api/v1/auth/refresh for its
        access token. Every refusal caused by the request or the provider answers
        400 {"error":"Login failed"}. A provider that does not answer, answers with
        a server error, or refuses this server's client credentials (a configuration
        problem, logged at Error level) answers 502.
      parameters:
      - description: Authorization code from the identity provider
        in: query
        name: code
        type: string
      - description: State of the login
        in: query
        name: state
        type: string
      - description: Error code from the identity provider (the login is refused)
        in: query
        name: error
        type: string
      - description: Ignored
        in: query
        name: error_description
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to the web UI
          schema:
            type: string
        "400":
          description: Login failed
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Login not permitted (disabled account)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "499":
          description: Client closed request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "501":
          description: Refresh tokens not enabled
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Identity provider unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: OIDC callback
      tags:
      - auth
  /api/v1/auth/oidc/login:
    get:
      description: Redirects the browser to the identity provider (authorization code
        flow with PKCE S256, a random state and a nonce). The state, the PKCE verifier
        and the nonce are kept on the server for OIDC_STATE_TTL and work once; a short-lived
        httpOnly cookie (oidc_binding, with the __Host- prefix unless SECURE_COOKIES=false;
        SameSite=Lax, Path /) ties the login to this browser. Answers 404 unless AUTH_ENABLED
        and OIDC_ENABLED are true. No parameter of the request is used.
      produces:
