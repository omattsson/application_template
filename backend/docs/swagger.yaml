  /ws:
    get:
      description: 'Upgrades the HTTP connection to a WebSocket for real-time events.
        With AUTH_ENABLED=false no credential is needed and any topic can be subscribed.
        With AUTH_ENABLED=true the upgrade needs one credential: `Authorization: Bearer
        <jwt>`, `X-API-Key: sk_<key>` (header only), or `?token=<jwt>` for browsers
        (removed from the URL before any logging). The upgrade runs the checks of
        the HTTP auth (token, session and user blocklists, a deleted or disabled user,
        an unknown, deleted or expired key) and counts against the per-IP RATE_LIMIT.
        A failed blocklist or user lookup refuses the upgrade (500). A socket over
        the per-user and per-key limit (WS_MAX_CONNECTIONS_PER_USER, default 16) is
        closed with code 1008 right after the upgrade. An open socket is closed with
        code 1008 on logout, logout-all, a disable, delete, role change or password
        reset of the user, a deleted key, and when the token or key expires; a periodic
        re-check closes the sockets that another replica revoked. Subscriptions are
        authorised: items and item:<id> for every user, user:<id> for that user (and
        admins), admin:<name> for admins; any other topic is ignored.'
      parameters:
      - description: Access token (AUTH_ENABLED=true, browsers)
        in: query
        name: token
        type: string
      - description: API key (AUTH_ENABLED=true, header only)
        in: header
        name: X-API-Key
        type: string
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Open a WebSocket connection
      tags:
      - websocket
produces:
- application/json
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    description: 'With AUTH_ENABLED=true: an API key (sk_ and 64 hex characters) from
      POST /api/v1/api-keys. Not accepted on the key, user and audit log management
      routes, on logout-all or on the password change.'
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: 'With AUTH_ENABLED=true: "Bearer <access token>" from POST /api/v1/auth/login
      or /api/v1/auth/refresh. Not used with AUTH_ENABLED=false.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
