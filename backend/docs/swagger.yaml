  /api/v1/auth/password-reset:
    post:
      consumes:
      - application/json
      description: 'Sends a mail with a single-use reset link to the local account
        with this username, when the account exists, is enabled, has an email address,
        is not a service account (the bootstrap admin) and is not an SSO account.
        Public. Only available when PASSWORD_RESET_ENABLED=true (otherwise 404). The
        answer is always 202 with the same body, whether or not the account exists
        or got a mail (an unknown, ineligible, throttled or mailed account, and a
        mail failure, cannot be told apart by the status, the body, the headers or
        the time): the lookup and the send run after the answer. At most one mail
        per account in PASSWORD_RESET_MIN_INTERVAL; a request in that time sends nothing.
        The link is PASSWORD_RESET_URL + /reset-password#token=... and the token is
        valid for PASSWORD_RESET_TOKEN_TTL. A request that asks again replaces the
        unused earlier token. Unknown fields are refused. It has its own LOGIN_RATE_LIMIT
        budget per client IP. No cookie is set or read.'
      parameters:
      - description: The username of the account
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.PasswordResetAcceptedResponse'
        "400":
          description: No username, a username that cannot exist, or an invalid body
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: The password reset is not enabled
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request a password reset mail
      tags:
      - auth
  /api/v1/auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      description: 'Sets a new password with the token from the mail. Public. Only
        available when PASSWORD_RESET_ENABLED=true (otherwise 404). The password follows
        the password rules (at least 8 characters, at most 72 bytes) and is checked
        first: a bad password answers 400 and does not use up the token. Then the
        token is consumed atomically (single use: of two requests with the same token
        exactly one succeeds) and the new password is stored. A token that is malformed,
        unknown, used or expired, or of an account that was disabled, deleted, turned
        into a service account or lost its email address, answers one generic 400
        "Invalid or expired token". On success (204, no body) every session of the
        user ends the way an admin password reset ends it: the refresh tokens are
        revoked, every access token issued before is rejected (user block), the open
        WebSockets are closed and the failed-login lock of the account is cleared;
        the account can sign in with the new password at once, also when it was locked.
        API keys are kept: delete them separately when the account may have been exposed.
        The audit log gets an entry with the action password_reset (actor and entity:
        the account). When the password was stored but a revocation step failed, the
        answer is 500, the new password stands and the entry has revocation_failed.
        Unknown fields are refused. It has its own LOGIN_RATE_LIMIT budget per client
        IP. No cookie is set or read.'
      parameters:
      - description: The token and the new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PasswordResetConfirmRequest'
      produces:
      - application/json
      responses:
        "204":
          description: The password was changed
        "400":
          description: Invalid or expired token, or a password that breaks the rules
            (the token is not used up)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: The password reset is not enabled
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set a new password with a reset token
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: Issues a new access token for the session of the refresh token
        cookie and rotates the refresh token (the old one is consumed, a new cookie
        is set). The request needs the X-Requested-With header (any value) and must
        not be cross-site; otherwise 403. A session ends SESSION_MAX_LIFETIME after
        login and SESSION_IDLE_TIMEOUT after its last login or refresh; rotation never
        extends it, and the access token never outlives it. A token rotated less than
        REFRESH_REUSE_GRACE ago (two tabs refreshing at once) gets one more access
        token, once, without a new cookie. Any other reuse of a consumed token revokes
        the session and blocks its access tokens. A session that started before a
        user block (logout-all, a role change, disabling or deleting the user) is
        refused and revoked even when its refresh token was still active. The refresh
        cookie is named __Host-refresh_token unless SECURE_COOKIES=false (then refresh_token)
        and has Path /. Every refusal answers the same 401 and deletes the cookie.
      parameters:
      - description: Any value (CSRF protection), for example XMLHttpRequest
        in: header
        name: X-Requested-With
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RefreshResponse'
        "401":
          description: Invalid or expired session
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Cross-site request refused
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "501":
          description: Refresh tokens not enabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
