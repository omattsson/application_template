# Prometheus for the local development setup (docker-compose.otel.yml).
global:
  scrape_interval: 15s

scrape_configs:
  # The backend's /metrics endpoint (METRICS_ENABLED=true, METRICS_ADDR=:9090).
  # The dashboards read this job.
  - job_name: 'backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:9090']

  # OTel Collector internal metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # Tempo internal metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # Grafana internal metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # Prometheus self-scrape
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
