# Browser caching. A browser that keeps an old index.html after a redeploy
# asks for hashed /assets/ files that no longer exist, and with nosniff the
# index.html served for the missing script is refused: a blank page. So the
# shell (index.html, the SPA fallback and every other non-hashed file) is
# revalidated on each load and only the content-hashed /assets/ files are
# cached for good. The proxied /api/ and /ws set none: the backend decides.
# The value is sent by one server-level add_header (no "always": an error
# answer carries no cache header), so no location needs its own add_header.
map $uri $spa_cache_control {
    default            "no-cache";
    ~^/assets/         "public, max-age=31536000, immutable";
    ~^/(api/|ws)       "";
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Framing and sniffing protection for the SPA (same values as the backend
    # SecurityHeaders middleware). "always" adds them to error answers too.
    # nginx drops these server-level headers in any location that sets its own
    # add_header, so no location here does (frontend/src/__tests__/
    # nginxConf.test.ts checks it). A CSP is not set yet: it needs its own
    # review (inline styles, the /ws socket).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $spa_cache_control;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output. A file that is gone (an old index.html after a
    # redeploy) is a 404, not the SPA fallback index.html.
    location /assets/ {
        try_files $uri =404;
    }

    # Proxy API requests to the backend. The backend trusts this proxy
    # (TRUSTED_PROXIES) and reads the client IP from X-Forwarded-For: nginx
    # appends the address it received the request from, so a client value
    # sent from outside cannot replace it (the backend takes the right-most
    # address that is not a trusted proxy).
    location /api/ {
        proxy_pass http://backend:8081/;
        # The backend sends the same headers; hide them so the answer carries
        # one copy (a repeated X-Frame-Options is ignored by some browsers).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy WebSocket connections
    location /ws {
        # With auth on the browser sends its access token as ?token= (a
        # WebSocket cannot carry headers), so the request line must not be
        # written to the access log. An upstream error would write the request
        # line (token included) to the error log too, so only crit and worse
        # is logged here; upstream failures stay visible through /api/.
        access_log off;
        error_log /dev/stderr crit;
        proxy_pass http://backend:8081;
        # The backend sends the same headers; hide them so the answer carries
        # one copy (a repeated X-Frame-Options is ignored by some browsers).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }
}
